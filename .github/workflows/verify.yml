name: Verify
on:
  push:
    branches: [dev, stg, prod, feat/mia-fraude-game]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: |
          node --check mia/mia-recommander/game.js
          node --check mia/mia-recommander/api.js
          node --check mia/mia-recommander/viewport.js
          node --test tests/fraud-frontend.test.mjs
          for module in mia/mia-fraude/*.js; do node --check "$module"; done
          python -m compileall -q app deploy
