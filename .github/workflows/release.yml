name: Release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Explicit delivery target
        type: choice
        options: [staging, production]
        required: true
      digest:
        description: Validated staging image digest (production only)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  staging:
    if: inputs.target == 'staging' && github.ref == 'refs/heads/stg'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.14'}
      - run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/agentdouble/mia-demodays:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/agentdouble/mia-demodays
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy exact staging digest
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: bash deploy/ci-deliver.sh stage
  production:
    if: inputs.target == 'production' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Promote exact operator-validated staging image
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: bash deploy/ci-deliver.sh promote
