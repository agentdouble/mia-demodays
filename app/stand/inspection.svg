<svg xmlns="http://www.w3.org/2000/svg" class="stand-scene stand-inspection" viewBox="0 0 328 76"
     width="328" height="76" aria-hidden="true">
  <style>
    @media screen and (prefers-reduced-motion: no-preference) {
      .stand-inspection { --inspection-round: 6s; }
      .stand-inspection .lens { animation: inspection-scan var(--inspection-round) infinite; }
      .stand-inspection .clue { animation: inspection-clue var(--inspection-round) infinite; }
      .stand-inspection .stamp { animation: inspection-stamp var(--inspection-round) infinite; }
    }

    @keyframes inspection-scan {
      0%, 6%, 100% { transform: translate(0, 0); }
      24% { transform: translate(56px, -8px); }
      42%, 56% { transform: translate(110px, 8px); }
      69%, 85% { transform: translate(143px, -4px); }
    }

    @keyframes inspection-clue {
      0%, 39%, 87%, 100% { opacity: 0; }
      44%, 82% { opacity: 1; }
    }

    @keyframes inspection-stamp {
      0%, 58%, 94%, 100% { opacity: 0; }
      58% { transform: translateY(-12px); }
      65%, 85% { opacity: 1; transform: translateY(0); }
    }
  </style>

  <path fill="#271A10" d="M0 68h328v8H0z"/>
  <path fill="#78401D" d="M0 68h328v2H0zM28 28h31v2H28zM269 48h31v2h-31z"/>
  <path fill="#FF913D" opacity=".55" d="M28 35h18v2H28zM284 41h16v2h-16z"/>

  <!-- Case file, sample signature, magnifier and rejection stamp. -->
  <path fill="#78401D" d="M113 16h35l8 7h65v42H107V22z"/>
  <path fill="#FFC45F" d="M107 12h37l8 7h65v42H101V18z"/>
  <path fill="#FFF3DF" d="M112 23h94v31h-94z"/>
  <path fill="#BCA88E" d="M121 29h44v3h-44zM121 36h33v3h-33zM121 43h24v3h-24z"/>
  <path fill="none" stroke="#78401D" stroke-width="2" d="M175 47l5-7 4 7 5-4 4 2 5-2"/>
  <path class="clue" opacity="0" fill="none" stroke="#FF6340" stroke-width="2"
        d="M177 37h-6v5m24-5h6v5m-30 4v5h6m24-5v5h-6"/>

  <g class="lens" stroke-linecap="round">
    <path stroke="#271A10" stroke-width="10" d="M88 46l13 13"/>
    <path stroke="#FF913D" stroke-width="5" d="M88 46l13 13"/>
    <circle cx="78" cy="36" r="17" fill="#FFC45F" fill-opacity=".18" stroke="#271A10" stroke-width="7"/>
    <circle cx="78" cy="36" r="17" fill="none" stroke="#FFC45F" stroke-width="3"/>
    <path fill="none" stroke="#FFF3DF" stroke-width="2" d="M68 33a10 10 0 0 1 7-7"/>
  </g>

  <g class="stamp" opacity="0">
    <g transform="rotate(-10 270 36)">
      <rect x="253" y="20" width="32" height="32" rx="3" fill="#271A10" stroke="#FF6340" stroke-width="2"/>
      <path stroke="#FF6340" stroke-width="3" d="M262 29l14 14m0-14-14 14"/>
    </g>
  </g>
</svg>
