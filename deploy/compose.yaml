services:
  app:
    image: ${APP_IMAGE:?An immutable application image is required}
    env_file: ./app.env
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${APP_PORT:?}:8080"
    networks: [backend]
    restart: unless-stopped
    pids_limit: 80
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  caddy:
    profiles: [public]
    image: caddy:2@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /usr/local/lib/mia-demodays/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    ports: ["80:80", "443:443", "443:443/udp"]
    networks: [backend, edge]
    restart: unless-stopped
    pids_limit: 80
    mem_limit: 192m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  backend:
    internal: true
  edge: {}
